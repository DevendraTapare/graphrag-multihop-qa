name: graphrag-multihop
services:
  neo4j:
    image: neo4j:5.26.32-community
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Run python -m scripts.setup_env first}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_security_auth__minimum__password__length: 12
      NEO4J_server_bolt_advertised__address: "localhost:${NEO4J_BOLT_PORT:-7687}"
      NEO4J_server_http_advertised__address: "localhost:${NEO4J_HTTP_PORT:-7474}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/7474; printf 'GET / HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; read -r status <&3; [[ \"$$status\" == *' 200 '* ]]"
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 30s
    restart: "no"
    stop_grace_period: 60s
volumes:
  neo4j_data:
